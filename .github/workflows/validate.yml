name: Validate public mower package
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  offline-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: python tools/check_privacy.py
      - run: python tools/check_integration.py --output build/mower-coordinator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: mower-coordinator-manual-install
          path: build/mower-coordinator.zip
          if-no-files-found: error
  home-assistant-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install homeassistant==2026.10.4 colorlog==6.10.1 -r requirements-dev.txt
      # Includes real HA config/options-flow objects with temporary local state.
      - run: python -m unittest discover -s tests -v
      # Preserve validation of the original generated YAML reference package.
      - run: python tools/check_ha_config.py
  isolated-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: docker compose -f lab/compose.yaml up -d
      - name: Wait for isolated Home Assistant
        run: |
          python - <<'PY'
          import sys, time
          sys.path.insert(0, 'lab')
          from client import api
          for attempt in range(180):
              try:
                  api('/api/onboarding')
                  break
              except Exception:
                  time.sleep(1)
          else:
              raise SystemExit('Isolated lab did not become ready')
          PY
      - run: python lab/client.py
      - run: python tools/test_lab.py
      - run: python lab/exercise_wizard.py
      - run: python lab/exercise_runtime.py
      - run: python lab/exercise_options.py
      - run: python lab/exercise_runtime.py --fresh --map-change
      - name: Stop isolated lab
        if: always()
        run: docker compose -f lab/compose.yaml down
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
