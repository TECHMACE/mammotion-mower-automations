reset:
  name: Reset fake mower
  description: Resets synthetic observations and captured evidence, not coordinator storage.
set_state:
  name: Set fake observations
  description: Set simulator fields only. Developer tools YAML mode accepts the documented fields.
tick:
  name: Advance fake mower
  description: Advances progress, return, or charging by one deterministic step.
  fields:
    seconds:
      selector:
        number:
          min: 1
          max: 3600
    progress:
      selector:
        number:
          min: 0
          max: 100
    battery:
      selector:
        number:
          min: 0
          max: 100
